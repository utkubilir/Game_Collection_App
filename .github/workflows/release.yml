name: release

# Build the runnable jar and attach it to a GitHub Release when a version tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/game-collection-app.jar
          generate_release_notes: true
